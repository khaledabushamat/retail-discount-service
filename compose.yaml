services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discounts}
      POSTGRES_USER: ${POSTGRES_USER:-discount_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-discount_user}']
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-discounts}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: retail-discount-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER:-discount_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-bytes-long}
    ports:
      - '8080:8080'
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health || exit 1' ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  sonar-db:
    image: postgres:17
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mongo-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonar-db-data: