spring:
  application:
    name: retail-discount-service

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-at-least-32-bytes-long}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: "${POSTGRES_URL:jdbc:postgresql://localhost:5432/discounts}"
    username: ${POSTGRES_USER:discount_user}
    password: ${POSTGRES_PASSWORD:secret}
  data:
    mongodb:
      uri: "${MONGO_URI:mongodb://root:secret@localhost:27017/discounts?authSource=admin}"

---
spring:
  config:
    activate:
      on-profile: docker
  docker:
    compose:
      enabled: false
  datasource:
    url: "${POSTGRES_URL:jdbc:postgresql://postgres:5432/discounts}"
    username: ${POSTGRES_USER:discount_user}
    password: ${POSTGRES_PASSWORD:secret}
  data:
    mongodb:
      uri: "${MONGO_URI:mongodb://root:secret@mongodb:27017/discounts?authSource=admin}"